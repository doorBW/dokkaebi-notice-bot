name: 도깨비의세계 공지 확인

on:
  schedule:
    - cron: "*/10 * * * *"   # 10분마다 (GitHub 사정에 따라 몇 분씩 늦어질 수 있음)
  workflow_dispatch:          # Actions 탭에서 수동 실행
    inputs:
      post_latest:
        description: "게시판마다 가장 최근 글 1개를 보내보기 (연결 테스트)"
        type: boolean
        default: false

concurrency:
  group: notice
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 이미 보낸 글 번호(state.json)를 실행 사이에 이어서 쓰기 위한 캐시
      - name: 상태 불러오기
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: notice-state-${{ github.run_id }}
          restore-keys: notice-state-

      - name: 공지 확인
        env:
          DISCORD_WEBHOOK_NOTICE: ${{ secrets.DISCORD_WEBHOOK_NOTICE }}
          DISCORD_WEBHOOK_UPDATE: ${{ secrets.DISCORD_WEBHOOK_UPDATE }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BOARD_CODES: ${{ vars.BOARD_CODES }}
        run: python bot.py ${{ inputs.post_latest && '--post-latest' || '' }}

      - name: 상태 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: notice-state-${{ github.run_id }}
